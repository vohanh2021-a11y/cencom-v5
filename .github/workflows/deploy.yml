name: Deploy (On-Premise)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image v5
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: gara_reconstruction_v5
          file: gara_reconstruction_v5/Dockerfile
          tags: cencomos/gara:${{ github.ref_name }}
          push: false

  deploy-onpremise:
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ secrets.HOST != '' }}
    environment: production
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SSH key from secret
        run: |
          touch deploy_key
          chmod 600 deploy_key
          echo "${{ secrets.SSH_KEY }}" > deploy_key

      - name: Known host keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SCP
        run: |
          scp -i deploy_key -r ./* ${{ secrets.SSH_USER }}@${{ secrets.HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Restart service via SSH
        run: |
          ssh -i deploy_key ${{ secrets.SSH_USER }}@${{ secrets.HOST }} "cd ${{ secrets.DEPLOY_PATH }}/gara_reconstruction_v5 && docker compose down && docker compose up -d"
