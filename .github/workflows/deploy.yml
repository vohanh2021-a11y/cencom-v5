name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub (if applicable)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image v5
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: gara_reconstruction_v5
          file: gara_reconstruction_v5/Dockerfile
          tags: cencomos/gara:v${GITHUB_REF_NAME}
          cache-from: type=registry,registry=ghcr.io/owner/cencomos-gara-cache
          cache-to: type=registry,registry=ghcr.io/owner/cencomos-gara-cache,mode=max

  deploy-onpremise:
    runs-on: ubuntu-latest
    needs: build-image
    if: secrets.HOST != ''
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SSH key from secret
        run: |
          echo "${{ secrets.SSH_KEY }}" > deploy_key
          chmod 600 deploy_key

      - name: Known host keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SCP
        run: |
          scp -i deploy_key -r ./* ${{ secrets.SSH_USER }}@${{ secrets.HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Restart service via SSH
        run: |
          ssh -i deploy_key ${{ secrets.SSH_USER }}@${{ secrets.HOST }} "cd ${{ secrets.DEPLOY_PATH }} && docker compose down && docker compose up -d"

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: build-image
    if: secrets.VERCEL_TOKEN != ''
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel
        run: |
          vercel --token ${{ secrets.VERCEL_TOKEN }} --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}