name: UAT Video

on:
  workflow_dispatch:
  workflow_run:
    types: [completed]
    workflows: ["CI (CencomOS Gara v5.0)"]
    branches: [main]

jobs:
  uat-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cencom
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cencom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gara_reconstruction_v5/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gara_reconstruction_v5

      - name: Create .env.local
        run: |
          cat > .env.local << EOF
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cencom
          SESSION_SECRET=ci-test-secret-for-uat-only-32-chars-min
          EOF
        working-directory: gara_reconstruction_v5

      - name: Run migrations and seed
        run: npx tsx db/migrate.ts && npx tsx db/seed.ts
        working-directory: gara_reconstruction_v5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cencom

      - name: Start app dev server (port 3001)
        run: |
          npm run dev &
          npx wait-on http://localhost:3001 --timeout 30000
        working-directory: gara_reconstruction_v5
        env:
          PORT: "3001"

      - name: Record UX video
        run: |
          if [ -f scripts/record-ux.mjs ]; then
            node scripts/record-ux.mjs
          else
            echo "⚠️ scripts/record-ux.mjs chưa tồn tại — bỏ qua video record"
          fi
        working-directory: gara_reconstruction_v5
        env:
          APP_URL: http://localhost:3001

      - name: Upload video and UX review artifact
        uses: actions/upload-artifact@v4
        with:
          name: uat-video
          path: |
            gara_reconstruction_v5/videos/*.webm
            gara_reconstruction_v5/docs/plan_ui/UX_REVIEW.md
          retention-days: 7
