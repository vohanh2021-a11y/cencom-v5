name: UAT Video

on:
  workflow_dispatch:
  workflow_run:
    types: [completed]
    workflows: ["CI"]
    branches: [main]

jobs:
  uat-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cencom
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health pg_isready -U postgres -d cencom
          --name postgres-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations and seed
        run: npx tsx db/migrate.ts && npx tsx db/seed.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/cencom

      - name: Start app dev server (port 3001)
        run: |
          APP_URL=http://localhost:3001 npm run dev &
          # Wait for app to become ready (simple sleep; adjust if using wait-on)
          sleep 15

      - name: Record UX video
        # NOTE: script record-ux.mjs sẽ tồn tại ở Wave B.
        #       Nếu chưa có, workflow sẽ bỏ qua (comment) hoặc thoát lỗ mềm.
        run: |
          if [ -f scripts/record-ux.mjs ]; then
            node scripts/record-ux.mjs
          else
            echo "⚠️ scripts/record-ux.mjs chưa tồn tại (Wave B chưa triển khai) — bỏ qua video record"
          fi
        env:
          APP_URL: http://localhost:3001

      - name: Upload video and UX review artifact
        uses: actions/upload-artifact@v4
        with:
          name: uat-video
          path: |
            videos/*.webm
            docs/plan_ui/UX_REVIEW.md
          retention-days: 7