<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - CencomOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #8e44ad 0%, #e843b1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pass-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 400px;
        }
        .pass-container h2 { color: #5d4037; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #8e44ad; }
        .btn { width: 100%; padding: 16px; background: #8e44ad; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #9b59b6; }
        .success { text-align: center; padding: 40px; display: none; }
        .success h2 { color: #27ae60; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="pass-container">
        <h2>Thay đổi mật khẩu</h2>
        <form id="pass-form">
            <div class="form-group">
                <label for="old-pass">Mật khẩu cũ</label>
                <input type="password" id="old-pass" placeholder="Mật khẩu hiện tại">
            </div>
            <div class="form-group">
                <label for="new-pass">Mật khẩu mới</label>
                <input type="password" id="new-pass" placeholder="Mat khau moi (it nhat 6 ky tu)">
            </div>
            <div class="form-group">
                <label for="confirm-pass">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirm-pass" placeholder="Nhap lai mat khau moi">
            </div>
            <button type="submit" class="btn">Cap nhat</button>
        </form>
        <div id="success" class="success">
            <h2>Mat khau da duoc cap nhat!</h2>
            <p>Mat khau moi da duoc ghi trong he thong.</p>
        </div>
    </div>

    <script>
        document.getElementById('pass-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const oldPass = document.getElementById('old-pass').value;
            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;
            
            if (oldPass && newPass && confirmPass) {
                if (newPass === confirmPass && newPass.length >= 6) {
                    document.getElementById('pass-form').style.display = 'none';
                    document.getElementById('success').style.display = 'block';
                } else {
                    alert('Mat khau moi khong khop!');
                }
            } else {
                alert('Vui long day du tat ca truong!');
            }
        });
    </script>
</body>
</html>
