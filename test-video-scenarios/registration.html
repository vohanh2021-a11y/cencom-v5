<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - CencomOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reg-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 450px;
        }
        .reg-container h2 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #2c3e50; }
        .btn { width: 100%; padding: 16px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #34495e; }
        .success { text-align: center; padding: 40px; display: none; }
        .success h2 { color: #27ae60; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="reg-container">
        <h2>Đăng ký tài khoản mới</h2>
        <form id="reg-form">
            <div class="form-group">
                <label for="reg-user">Họ và tên</label>
                <input type="text" id="reg-user" placeholder="Nhập họ và tên">
            </div>
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="nhap@email.com">
            </div>
            <div class="form-group">
                <label for="reg-pass">Mật khẩu</label>
                <input type="password" id="reg-pass" placeholder="Mat khau it nhat 6 ky tu">
            </div>
            <button type="submit" class="btn">Dang ky</button>
        </form>
        <div id="success" class="success">
            <h2>Dang ky thanh cong!</h2>
            <p>Tai khoan da duoc tao thanh cong.</p>
        </div>
    </div>

    <script>
        document.getElementById('reg-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('reg-user').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            
            if (user && email && pass && pass.length >= 6) {
                document.getElementById('reg-form').style.display = 'none';
                document.getElementById('success').style.display = 'block';
            } else {
                alert('Vui long day du thong tin! Mat khau it nhat 6 ky tu.');
            }
        });
    </script>
</body>
</html>
