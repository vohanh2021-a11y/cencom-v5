<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Login - CencomOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 400px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #1e3a5f; font-size: 28px; }
        .logo p { color: #666; margin-top: 8px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #1e3a5f; }
        button {
            width: 100%;
            padding: 16px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #2d5a87; }
        .success-msg {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .success-msg h2 { color: #28a745; margin-bottom: 16px; }
        .success-msg p { color: #666; }
    </style>
</head>
<body>
    <div class="login-container">
        <div id="login-form">
            <div class="logo">
                <h1>CencomOS</h1>
                <p>He thong quan ly gara</p>
            </div>
            <div class="form-group">
                <label for="user">Tai khoan</label>
                <input type="text" id="user" placeholder="Nhap tai khoan">
            </div>
            <div class="form-group">
                <label for="pass">Mat khau</label>
                <input type="password" id="pass" placeholder="Nhap mat khau">
            </div>
            <button id="login-btn">Dang nhap</button>
        </div>
        <div id="success-msg" class="success-msg">
            <h2>Dang nhap thanh cong!</h2>
            <p>Chao mung ban den voi CencomOS</p>
        </div>
    </div>

    <script>
        document.getElementById('login-btn').addEventListener('click', function() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            
            if (user && pass) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';
            } else {
                alert('Vui long nhap day du thong tin!');
            }
        });
    </script>
</body>
</html>
