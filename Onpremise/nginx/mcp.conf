# =============================================================================
# Onpremise/nginx/mcp.conf — LAN entry cho MCP Streamable HTTP (TM8)
# File MOI — KHONG sua nginx.conf goc. Day la block `location` de INCLUDE
# vao server block HTTPS (listen 443) cua nginx.conf.
#
# ## Cach bat (3 buoc) — see also docker-compose.mcp.yml (service cencom-mcp)
#
# (1) THEM 1 DONG vao server block 443 trong nginx.conf (ben canh cac
#     location /api/... hien co):
#
#         include /etc/nginx/mcp.conf;
#
# (2) MOUNT file trong docker-compose (service cencom-nginx, volumes):
#
#         - ./nginx/mcp.conf:/etc/nginx/mcp.conf:ro      # neu dung bản tĩnh (cách B)
#       hoặc:
#         - ./nginx/mcp.conf:/etc/nginx/mcp.conf.template:ro   # nếu dùng envsubst (cách A)
#
# (3) NGINX INJECT BEARER TỪ ENV `MCP_API_KEY` — dat tren service cencom-nginx:
#
#         environment:
#           - MCP_API_KEY=${MCP_API_KEY}
#
#     LUU Y THAN TRONG (truth note): nginx THUONG (binary chuan) KHONG tu
#     thay ${MCP_API_KEY} thanh gia tri env trong proxy_set_header. Hai cach
#     lam dung thuc te:
#
#     Cach A (khuyen dung — envsubst luc container khoi dong):
#       mount file nay thanh /etc/nginx/mcp.conf.template va override command
#       cua cencom-nginx (ap dung duoc khi `docker compose ... up`, bao toan
#       secret nam trong env, khong commit vao repo):
#
#         command: >
#           sh -c "envsubst '$$MCP_API_KEY' < /etc/nginx/mcp.conf.template
#                  > /etc/nginx/mcp.conf
#                  && nginx -g 'daemon off;'"
#
#     Cach B (tinh — sinh file truoc khi deploy):
#       chay 1 lan tren may deploy (Linux/WSL co envsubst; Win dung sed hoac
#       node script):
#
#         envsubst '$MCP_API_KEY' < nginx/mcp.conf > nginx/mcp.conf.rendered
#       roi mount mcp.conf.rendered :/etc/nginx/mcp.conf:ro.
#       (khong commit file rendered — trung chat noi quy, .gitignore no.)
#
#     Neu client tu gui Authorization (client MCP khai bao header trong
#     config), XOAN dong proxy_set_header Authorization duoi day de nginx
#     chuan theo header goc cua client.
# =============================================================================

location /mcp {
    # Service DNS trong docker network (KHONG dung 127.0.0.1 — nginx o container khac)
    proxy_pass http://cencom-mcp:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx thay client bang bearer chung (LAN single-tenant) — render bằng envsubst (cach A/B tren)
    proxy_set_header Authorization "Bearer ${MCP_API_KEY}";
    # SSE / long-poll: khong dem timeout ngan, khong buffer stream
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    chunked_transfer_encoding on;
}
