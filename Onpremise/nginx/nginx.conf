worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type    application/octet-stream;

    # Docker embedded DNS — resolve service names tại RUNTIME (không fail khi upstream chưa lên)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss;

    # ============== HTTP → HTTPS redirect ==============
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ============== HTTPS Server ==============
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Self-signed certificate
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self';" always;

        # CSRF protection: chấp nhận mọi origin (LAN), chặn origin lạ nước ngoài
        # Nếu cần chặn chặt hơn, uncomment các dòng dưới:
        # set $origin_ok 0;
        # if ($http_origin ~* "^https://(cencom\.lan|cencom\.local|[0-9]+\.[0-9]+\.[0-9]+\.)") {
        #     set $origin_ok 1;
        # }
        # if ($origin_ok = 0) {
        #     return 403;
        # }

        # Proxy tới Next.js App (direct — app luôn up, tránh lỗi body với proxy_pass biến)
        location / {
            proxy_pass http://cencom-web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # WebSocket proxy cho Realtime (Supabase Realtime)
        location /realtime {
            set $rt_upstream http://supabase-realtime:54324;
            proxy_pass $rt_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Storage API proxy
        location /storage {
            set $st_upstream http://supabase-storage:54325;
            proxy_pass $st_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Health check endpoint (ẩn, không log)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
