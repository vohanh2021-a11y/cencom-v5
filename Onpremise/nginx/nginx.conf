# =============================================================================
# CencomOS Gara — On-Premise Nginx reverse proxy (LAN / Intranet)
# - Thay thế toàn bộ /etc/nginx/nginx.conf (compose mount).
# - Phục vụ HTTPS (self-signed) và proxy ngược tới container cencom-web.
# - Realtime của v5 là SSE qua /api/realtime (HTTP thuần) → đã được proxy / hỗ trợ.
# - Nếu deploy bản v4 (Supabase): bỏ comment block "Realtime v4 (Supabase)" ở dưới.
#
# Cert: do scripts/init_certs.sh (Linux/WSL) hoặc init_certs_win.ps1 (Win) sinh vào
#       Onpremise/nginx/certs {server.crt, server.key}
# Mount trong docker-compose: ./nginx/certs:/etc/nginx/certs:ro
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss;

    # Cho phép nâng cấp WebSocket/SSE (chuẩn nginx)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream cencom_backend {
        # Tên service Docker Compose v5 (cùng Docker network)
        server web:3000;
        keepalive 32;
    }

    upstream cencom_mcp {
        # MCP server HTTP transport
        server mcp:3001;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        # Self-signed cert (khớp với mount ./nginx/certs:/etc/nginx/certs)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:;" always;

        # ===== Proxy chính tới Next.js (hỗ trợ cả SSE/WebSocket qua Upgrade) =====
        location / {
            proxy_pass http://cencom_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ===== Realtime SSE (v5) — không buffer, timeout dài =====
        location /api/realtime {
            proxy_pass http://cencom_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }

        # ===== Health check (ẩn log) =====
        location /api/health {
            proxy_pass http://cencom_backend;
            access_log off;
        }

        # ===== MCP HTTP transport (LAN) =====
        location /mcp {
            proxy_pass http://cencom_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ===== Static files caching =====
        location /_next/static/ {
            proxy_pass http://cencom_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ===== Realtime v4 (Supabase Realtime) — CHỈ bật khi deploy bản v4 =====
        # location /realtime {
        #     proxy_pass http://supabase-realtime:54324;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection $connection_upgrade;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_read_timeout 86400s;
        #     proxy_send_timeout 86400s;
        # }
    }
}
