# Onpremise/docker-compose.yml — CencomOS Gara v5 (on-premise)
# PostgreSQL thuần + Next.js standalone + Nginx reverse proxy
# ⚠️ Copy file này thành .env.onpremise.local và điền secrets TRƯỚC khi chạy.

services:
  # ---------- DATABASE ----------
  db:
    image: postgres:16-alpine
    container_name: cencom_v5_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cencom}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cencom}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- WEB APP (Next.js standalone) ----------
  web:
    build:
      context: ../gara_reconstruction_v5
      dockerfile: Dockerfile
      target: runner
    container_name: cencom_v5_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-cencom}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-strong-secret}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- MCP SERVER (optional) ----------
  mcp:
    build:
      context: ../gara_reconstruction_v5
      dockerfile: Dockerfile
      target: mcp
    container_name: cencom_v5_mcp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-cencom}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-strong-secret}
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3001"
      MCP_USER: ${MCP_USER:-admin}
      MCP_PASS: ${MCP_PASS:-}
      MCP_ROLE: ${MCP_ROLE:-giamdoc}
      MCP_WRITE_TOOLS: ${MCP_WRITE_TOOLS:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
    command: ["npx", "tsx", "mcp-server/http.ts"]
    expose:
      - "3001"

  # ---------- REVERSE PROXY (HTTPS) ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: cencom_v5_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - mcp

volumes:
  pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/pg_data
