<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Đang kết nối…</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 0 24px;
      }
      .spin {
        width: 44px;
        height: 44px;
        border: 4px solid #334155;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: r 1s linear infinite;
      }
      @keyframes r {
        to {
          transform: rotate(360deg);
        }
      }
      .title {
        font-size: 18px;
        font-weight: 600;
      }
      .small {
        opacity: 0.65;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spin"></div>
      <div class="title">Đang kết nối đến hệ thống garage…</div>
      <div class="small" id="msg">Vui lòng bật server nếu chưa chạy.</div>
    </div>

    <script>
      (function () {
        var url = window.__GARAGE_URL__;
        var msg = document.getElementById("msg");
        if (!url) {
          msg.textContent = "Lỗi: chưa cấu hình URL (thiếu config.json).";
          return;
        }
        function connect() {
          fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" })
            .then(function () {
              // Thành công -> chuyển sang web garage (cùng cửa sổ).
              window.location.href = url;
            })
            .catch(function () {
              msg.textContent = "Chưa kết nối được, thử lại sau 5 giây…";
              setTimeout(connect, 5000);
            });
        }
        connect();
      })();
    </script>
  </body>
</html>
