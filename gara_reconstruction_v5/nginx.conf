user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    gzip               on;
    server_tokens      off;

    # WebSocket / SSE upgrade map (dùng cho kết nối realtime tương lai)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ============================================================
    # HTTP (80) → chuyển hướng bắt buộc lên HTTPS
    # ============================================================
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge (nếu sau này dùng cert thật)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # HTTPS (443) → reverse proxy tới web:3000
    # ============================================================
    server {
        listen 443 ssl;
        server_name _;

        # SSL self-signed placeholder (sinh bởi scripts/init_certs.sh)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Bổ sung security headers (kết hợp với CSP từ app)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ----------------------------------------------------------
        # SSE realtime: /api/realtime (EventSource, Postgres LISTEN/NOTIFY)
        # Phải tắt buffering để đẩy event ngay lập tức
        # ----------------------------------------------------------
        location /api/realtime {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # ----------------------------------------------------------
        # Các route còn lại → web:3000
        # ----------------------------------------------------------
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 60s;
        }
    }
}
