# deploy.yml — Deploy Pipeline (On-Premise + Vercel)
# Trigger: tag v* → build + deploy
#
# ╔══════════════════════════════════════════════════════════════════════╗
# ║  QUAN TRỌNG: Chọn 1 trong 2 mode deploy, comment mode còn lại   ║
# ║                                                                    ║
# ║  Mode A: On-Premise (Docker + SCP) — cho Intranet/LAN             ║
# ║  Mode B: Vercel (Cloud) — cho public/Internet                     ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Secrets cần cấu hình trong GitHub → Settings → Secrets:
#   Mode A (On-Premise): HOST, SSH_KEY, SSH_USER, DEPLOY_PATH
#   Mode B (Vercel):     VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

name: Deploy

on:
  push:
    tags: ["v*"]

# Không chạy deploy song song cùng lúc
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Validation Gate ────────────────────────────────────────────────
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ═══════════════════════════════════════════════════════════════════
  #  MODE A: On-Premise Deploy (Docker + SCP)
  #  Yêu cầu secrets: HOST, SSH_KEY, SSH_USER, DEPLOY_PATH
  # ═══════════════════════════════════════════════════════════════════
  deploy-onpremise:
    name: Deploy On-Premise (Docker)
    runs-on: ubuntu-latest
    needs: validate
    # Chỉ chạy khi tag match pattern v*
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag cencom-gara:${{ steps.tag.outputs.version }} \
            --tag cencom-gara:latest \
            --file Onpremise/Dockerfile.standalone \
            .

      # ── Push image lên registry (nếu dùng Docker Hub) ──
      # Uncomment nếu dùng Docker Hub / GHCR thay vì build trực tiếp trên server
      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Push image to GHCR
      #   run: |
      #     docker tag cencom-gara:${{ steps.tag.outputs.version }} ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
      #     docker tag cencom-gara:latest ghcr.io/${{ github.repository }}:latest
      #     docker push ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
      #     docker push ghcr.io/${{ github.repository }}:latest

      # ── Deploy qua SCP/SSH ──
      # Upload docker-compose.yml + deploy script lên server
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull image mới (nếu dùng registry)
            # docker pull ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}

            # Hoặc: copy image từ build artifact và load
            # docker load < cencom-gara-${{ steps.tag.outputs.version }}.tar

            # Stop旧 container, start mới
            docker compose down || true
            docker compose up -d --force-recreate

            # Health check
            sleep 10
            curl -sf http://localhost:3000/api/health || exit 1
            echo "✅ Deploy ${{ steps.tag.outputs.version }} successful"

      # Cleanup sau deploy
      - name: Cleanup old images
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker image prune -f

  # ═══════════════════════════════════════════════════════════════════
  #  MODE B: Vercel Deploy (Cloud)
  #  Yêu cầu secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
